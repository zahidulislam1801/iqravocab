name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    # Skip the build when only these files change (none of them go into the app)
    paths-ignore:
      - '**.md'
      - '.nojekyll'
      - '404.html'
      - 'favicon.ico'
      - 'og-image.png'
      - 'sw.js'
      - 'firebase-messaging-sw.js'
      - '.github/workflows/validate.yml'
      - '.github/dependabot.yml'

# Needed to publish the Release at the end
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Copy web files
        run: |
          mkdir www
          cp index.html manifest.webmanifest logo.svg privacy.html terms.html www/
          cp apple-touch-icon.png icon-192.png icon-512.png icon-maskable-512.png www/

      - name: Install and create Android project
        run: |
          npm install
          npm install @capacitor/app@$(node -p "require('@capacitor/core/package.json').version.split('.')[0]")
          npm install @capacitor/browser@$(node -p "require('@capacitor/core/package.json').version.split('.')[0]")
          npx cap add android
          npx cap sync android

      - name: Apply IQRA Vocab name and logo
        run: |
          set -e
          sudo apt-get update -qq
          sudo apt-get install -y -qq imagemagick
          RES=android/app/src/main/res
          NAME="IQRA Vocab"
          sed -i "s|<string name=\"app_name\">[^<]*</string>|<string name=\"app_name\">$NAME</string>|; s|<string name=\"title_activity_main\">[^<]*</string>|<string name=\"title_activity_main\">$NAME</string>|" $RES/values/strings.xml
          BG=$(convert icon-maskable-512.png -format '%[hex:p{4,4}]' info:)
          BG="#${BG:0:6}"
          echo "icon background: $BG"
          for d in mdpi:48:108 hdpi:72:162 xhdpi:96:216 xxhdpi:144:324 xxxhdpi:192:432; do
            IFS=: read dn s f <<< "$d"
            M=$RES/mipmap-$dn
            h=$((s/2)); i=$((f*66/100))
            convert icon-512.png -resize ${s}x${s} "$M/ic_launcher.png"
            convert icon-512.png -resize ${s}x${s} \( -size ${s}x${s} xc:none -fill white -draw "circle $h,$h $h,0" \) -compose DstIn -composite "$M/ic_launcher_round.png"
            convert icon-maskable-512.png -resize ${i}x${i} -background none -gravity center -extent ${f}x${f} "$M/ic_launcher_foreground.png"
          done
          printf '<?xml version="1.0" encoding="utf-8"?>\n<resources>\n    <color name="ic_launcher_background">%s</color>\n</resources>\n' "$BG" > $RES/values/ic_launcher_background.xml
          for f in $(find $RES -name 'splash*.png'); do
            w=$(identify -format '%w' "$f"); hh=$(identify -format '%h' "$f")
            m=$((w<hh?w:hh)); l=$((m*28/100))
            convert -size ${w}x${hh} xc:"$BG" \( icon-512.png -resize ${l}x${l} \) -gravity center -composite "$f"
          done

      - name: Fix app ID and add return link
        run: |
          set -e
          sed -i 's/applicationId "[^"]*"/applicationId "com.iqravocab.app"/' android/app/build.gradle
          python3 - <<'PY'
          p='android/app/src/main/AndroidManifest.xml'
          s=open(p,encoding='utf-8').read()
          f='''        <intent-filter>
              <action android:name="android.intent.action.VIEW" />
              <category android:name="android.intent.category.DEFAULT" />
              <category android:name="android.intent.category.BROWSABLE" />
              <data android:scheme="iqravocab" />
          </intent-filter>
          </activity>'''
          if 'android:scheme="iqravocab"' not in s:
              s=s.replace('</activity>',f,1)
          open(p,'w',encoding='utf-8').write(s)
          PY

      - name: Add in-app updater (optional, skipped safely if the project layout is unexpected)
        run: |
          mkdir -p /tmp/iqbak
          python3 - <<'PY'
          import glob, re, shutil, sys

          man = 'android/app/src/main/AndroidManifest.xml'
          paths = glob.glob('android/app/src/main/res/xml/file_paths.xml')
          mains = glob.glob('android/app/src/main/java/**/MainActivity.java', recursive=True)
          s = open(man, encoding='utf-8').read()
          if len(mains) != 1 or not paths or 'fileprovider' not in s or 'cache-path' not in open(paths[0], encoding='utf-8').read():
              print('::warning::In-app updater skipped: unexpected Android project layout')
              sys.exit(0)
          m = open(mains[0], encoding='utf-8').read()
          if 'onCreate' in m or 'registerPlugin' in m:
              print('::warning::In-app updater skipped: MainActivity was already customised')
              sys.exit(0)
          pk = re.search(r'^package\s+([\w.]+);', m, re.M).group(1)

          shutil.copy(man, '/tmp/iqbak/AndroidManifest.xml')
          shutil.copy(mains[0], '/tmp/iqbak/MainActivity.java')
          open('/tmp/iqbak/main_path', 'w').write(mains[0])

          plugin = mains[0].replace('MainActivity.java', 'IqUpdaterPlugin.java')
          open('/tmp/iqbak/plugin_path', 'w').write(plugin)

          open(plugin, 'w', encoding='utf-8').write('''package __PKG__;

          import android.content.Context;
          import android.content.Intent;
          import android.net.Uri;
          import android.os.Build;
          import android.provider.Settings;
          import androidx.core.content.FileProvider;
          import com.getcapacitor.JSObject;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.CapacitorPlugin;
          import java.io.File;
          import java.io.FileOutputStream;
          import java.io.InputStream;
          import java.net.HttpURLConnection;
          import java.net.URL;

          @CapacitorPlugin(name = "IqUpdater")
          public class IqUpdaterPlugin extends Plugin {

              @PluginMethod
              public void downloadAndInstall(final PluginCall call) {
                  final String link = call.getString("url");
                  if (link == null || !link.startsWith("https://github.com/")) {
                      call.reject("bad-url");
                      return;
                  }
                  final Context ctx = getContext();
                  if (Build.VERSION.SDK_INT >= 26 && !ctx.getPackageManager().canRequestPackageInstalls()) {
                      try {
                          Intent s = new Intent(Settings.ACTION_MANAGE_UNKNOWN_APP_SOURCES, Uri.parse("package:" + ctx.getPackageName()));
                          s.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                          ctx.startActivity(s);
                      } catch (Exception e) {
                      }
                      JSObject r = new JSObject();
                      r.put("status", "needs-permission");
                      call.resolve(r);
                      return;
                  }
                  new Thread(new Runnable() {
                      @Override
                      public void run() {
                          HttpURLConnection c = null;
                          try {
                              File dir = new File(ctx.getCacheDir(), "updates");
                              if (!dir.exists()) dir.mkdirs();
                              File out = new File(dir, "IQRA-Vocab.apk");
                              if (out.exists()) out.delete();
                              c = (HttpURLConnection) new URL(link).openConnection();
                              c.setInstanceFollowRedirects(true);
                              c.setConnectTimeout(15000);
                              c.setReadTimeout(30000);
                              c.connect();
                              if (c.getResponseCode() != 200) {
                                  call.reject("http-" + c.getResponseCode());
                                  return;
                              }
                              int total = c.getContentLength();
                              InputStream in = c.getInputStream();
                              FileOutputStream fo = new FileOutputStream(out);
                              byte[] buf = new byte[65536];
                              long done = 0;
                              int last = -1;
                              int n;
                              while ((n = in.read(buf)) > 0) {
                                  fo.write(buf, 0, n);
                                  done += n;
                                  if (total > 0) {
                                      int pct = (int) (done * 100 / total);
                                      if (pct != last) {
                                          last = pct;
                                          JSObject p = new JSObject();
                                          p.put("percent", pct);
                                          notifyListeners("progress", p);
                                      }
                                  }
                              }
                              fo.close();
                              in.close();
                              if (done < 1000000) {
                                  out.delete();
                                  call.reject("too-small");
                                  return;
                              }
                              Uri uri = FileProvider.getUriForFile(ctx, ctx.getPackageName() + ".fileprovider", out);
                              Intent i = new Intent(Intent.ACTION_VIEW);
                              i.setDataAndType(uri, "application/vnd.android.package-archive");
                              i.addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION | Intent.FLAG_ACTIVITY_NEW_TASK);
                              ctx.startActivity(i);
                              JSObject r = new JSObject();
                              r.put("status", "installing");
                              call.resolve(r);
                          } catch (Exception e) {
                              call.reject("failed");
                          } finally {
                              if (c != null) c.disconnect();
                          }
                      }
                  }).start();
              }
          }
          '''.replace('__PKG__', pk))

          open(mains[0], 'w', encoding='utf-8').write('''package __PKG__;

          import android.os.Bundle;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  registerPlugin(IqUpdaterPlugin.class);
                  super.onCreate(savedInstanceState);
              }
          }
          '''.replace('__PKG__', pk))

          perm = '<uses-permission android:name="android.permission.REQUEST_INSTALL_PACKAGES" />'
          if 'REQUEST_INSTALL_PACKAGES' not in s:
              s = s.replace('<application', '    ' + perm + '\n\n    <application', 1)
              open(man, 'w', encoding='utf-8').write(s)
          print('In-app updater added, package', pk)
          PY

      - name: Add fixed signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/iqra.keystore
          sed -i "s/versionCode 1/versionCode ${{ github.run_number }}/" android/app/build.gradle
          cat >> android/app/build.gradle <<'GRADLE'

          android {
              signingConfigs {
                  iqra {
                      storeFile file('iqra.keystore')
                      storePassword System.getenv('KEYSTORE_PASSWORD')
                      keyAlias System.getenv('KEY_ALIAS')
                      keyPassword System.getenv('KEYSTORE_PASSWORD')
                  }
              }
              buildTypes {
                  debug {
                      signingConfig signingConfigs.iqra
                  }
              }
          }
          GRADLE

      - name: Build APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          cd android
          chmod +x gradlew
          if ! ./gradlew assembleDebug; then
            if [ -f /tmp/iqbak/plugin_path ]; then
              echo "::warning::Build failed with the in-app updater. Retrying without it."
              cd ..
              cp /tmp/iqbak/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
              cp /tmp/iqbak/MainActivity.java "$(cat /tmp/iqbak/main_path)"
              rm -f "$(cat /tmp/iqbak/plugin_path)"
              cd android
              ./gradlew assembleDebug
            else
              exit 1
            fi
          fi

      - name: Show app ID
        run: |
          AAPT=$(ls $ANDROID_HOME/build-tools/*/aapt | tail -1)
          $AAPT dump badging android/app/build/outputs/apk/debug/app-debug.apk | head -1 || true

      - name: Name the APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk "IQRA Vocab.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: IQRA Vocab
          path: IQRA Vocab.apk

      - name: Publish to Release (permanent download link)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -e
          cp "IQRA Vocab.apk" IQRA-Vocab.apk
          if gh release view android-latest >/dev/null 2>&1; then
            gh release delete android-latest --cleanup-tag -y
          fi
          gh release create android-latest IQRA-Vocab.apk \
            --title "IQRA Vocab Android (latest)" \
            --notes "Latest Android APK. Build #${{ github.run_number }}, commit ${GITHUB_SHA::7}. iq-build=${{ github.run_number }}" \
            --target "$GITHUB_SHA"
