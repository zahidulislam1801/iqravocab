name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Copy web files
        run: |
          mkdir www
          cp index.html manifest.webmanifest logo.svg privacy.html terms.html www/
          cp apple-touch-icon.png icon-192.png icon-512.png icon-maskable-512.png www/

      - name: Install and create Android project
        run: |
          npm install
          npm install @capacitor/app@$(node -p "require('@capacitor/core/package.json').version.split('.')[0]")
          npm install @capacitor/browser@$(node -p "require('@capacitor/core/package.json').version.split('.')[0]")
          npx cap add android
          npx cap sync android

      - name: Apply IQRA Vocab name and logo
        run: |
          set -e
          sudo apt-get update -qq
          sudo apt-get install -y -qq imagemagick
          RES=android/app/src/main/res
          NAME="IQRA Vocab"
          sed -i "s|<string name=\"app_name\">[^<]*</string>|<string name=\"app_name\">$NAME</string>|; s|<string name=\"title_activity_main\">[^<]*</string>|<string name=\"title_activity_main\">$NAME</string>|" $RES/values/strings.xml
          BG=$(convert icon-maskable-512.png -format '%[hex:p{4,4}]' info:)
          BG="#${BG:0:6}"
          echo "icon background: $BG"
          for d in mdpi:48:108 hdpi:72:162 xhdpi:96:216 xxhdpi:144:324 xxxhdpi:192:432; do
            IFS=: read dn s f <<< "$d"
