name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Copy web files
        run: |
          mkdir www
          cp index.html manifest.webmanifest logo.svg privacy.html terms.html www/
          cp apple-touch-icon.png icon-192.png icon-512.png icon-maskable-512.png www/

      - name: Install and create Android project
        run: |
          npm install
          npx cap add android
          npx cap sync android

      - name: Add fixed signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/iqra.keystore
          sed -i "s/versionCode 1/versionCode ${{ github.run_number }}/" android/app/build.gradle
          cat >> android/app/build.gradle <<'GRADLE'

          android {
              signingConfigs {
                  iqra {
                      storeFile file('iqra.keystore')
                      storePassword System.getenv('KEYSTORE_PASSWORD')
                      keyAlias System.getenv('KEY_ALIAS')
                      keyPassword System.getenv('KEYSTORE_PASSWORD')
                  }
              }
              buildTypes {
                  debug {
                      signingConfig signingConfigs.iqra
                  }
              }
          }
          GRADLE

      - name: Build APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: IQRA-VOCAB-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
