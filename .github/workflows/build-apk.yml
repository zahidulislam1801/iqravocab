name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Copy web files
        run: |
          mkdir www
          cp index.html manifest.webmanifest logo.svg privacy.html terms.html www/
          cp apple-touch-icon.png icon-192.png icon-512.png icon-maskable-512.png www/

      - name: Install and create Android project
        run: |
          npm install
          npx cap add android
          npx cap sync android

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: IQRA-VOCAB-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
